document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tn.ghost:hover { border-color: var(--teal); color: var(--teal); }\n\n/* FOOTER */\nfooter { background: #071f30; color: rgba(255,255,255,0.3); padding: 1.8rem 6%; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }\nfooter a { color: rgba(255,255,255,0.3); text-decoration: none; }\nfooter a:hover { color: rgba(255,255,255,0.6); }\n\n@media (max-width: 780px) {\n  .hero-meta { gap: 1rem; }\n  .hero-dl { margin-left: 0; }\n  .authors-grid { grid-template-columns: 1fr; }\n  nav { padding: 0 4%; }\n  .nav-links { gap: 1rem; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- NAV -->\n<nav>\n  <a href=\"index.html\" class=\"nav-logo\">\n    <svg height=\"32\" viewBox=\"0 0 180 140\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n      <line x1=\"18\" y1=\"15\" x2=\"18\" y2=\"125\" stroke=\"white\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"18\" y1=\"70\" x2=\"48\" y2=\"15\" stroke=\"#5ecfdc\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"18\" y1=\"70\" x2=\"48\" y2=\"125\" stroke=\"white\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"94\" y1=\"15\" x2=\"70\" y2=\"32\" stroke=\"white\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"70\" y1=\"32\" x2=\"70\" y2=\"108\" stroke=\"#5ecfdc\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"70\" y1=\"108\" x2=\"94\" y2=\"125\" stroke=\"white\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"108\" y1=\"15\" x2=\"162\" y2=\"125\" stroke=\"white\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n      <line x1=\"162\" y1=\"15\" x2=\"108\" y2=\"125\" stroke=\"#5ecfdc\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fline>\n    <\u002Fsvg>\n    <span style=\"font-size:0.48rem; font-weight:200; letter-spacing:0.2em; color:rgba(255,255,255,0.35); margin-left:0.35rem; text-transform:uppercase; align-self:flex-end; padding-bottom:3px; line-height:1;\">KAISER CX<\u002Fspan>\n  <\u002Fa>\n  <ul class=\"nav-links\">\n    <li><a href=\"index.html\">Home<\u002Fa><\u002Fli>\n    <li><a href=\"control.html\">CONTROL<\u002Fa><\u002Fli>\n    <li><a href=\"advisory.html\">Advisory<\u002Fa><\u002Fli>\n    <li><a href=\"about.html\">About<\u002Fa><\u002Fli>\n    <li><a href=\"index.html#kontakt\">Contact<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"hero-inner\">\n    <div class=\"breadcrumb\"><a href=\"whitepaper.html\">Whitepaper<\u002Fa> &nbsp;›&nbsp; From Signal to Action<\u002Fdiv>\n    <div class=\"hero-eyebrow\">Whitepaper · Kaiser CX × Pollup AI<\u002Fdiv>\n    <h1>From Signal <span>to Action.<\u002Fspan><\u002Fh1>\n    <p class=\"hero-sub\">How AI helps CS teams hit retention and expansion goals — without growing headcount.<\u002Fp>\n    <div class=\"hero-meta\">\n      <span class=\"hero-byline\">By <strong>Christiane Kaiser<\u002Fstrong> (Kaiser CX) &amp; <strong>Caroline Dépierre<\u002Fstrong> (Pollup AI)<\u002Fspan>\n      <span class=\"hero-readtime\">9 min read<\u002Fspan>\n      <a href=\"whitepaper-signal-to-action.pdf\" download=\"\" class=\"hero-dl\">↓ Download PDF<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ARTICLE -->\n<article class=\"article\">\n\n  <p class=\"lede\">\n    <span class=\"who\">Who this is for<\u002Fspan>\n    This paper is written for CS leaders responsible for product adoption, renewals, and expansion — managing growing account portfolios with teams that aren't growing at the same pace. It's for those who have seen the first wave of AI in CS (email drafts, call summaries) and are asking what comes next. The focus throughout is practical: concrete examples, clear differentiation from traditional CS platforms, and a realistic picture of where to start.\n  <\u002Fp>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">01<\u002Fdiv>\n    <h2>The real problem isn't churn. It's timing.<\u002Fh2>\n    <p>Most CS teams know they're operating reactively. A customer flags a problem, a CSM investigates, and a response is prepared. The challenge is that by the time a customer says something, the decision has often already been made internally.<\u002Fp>\n    <p>The signals that precede disengagement are almost always behavioral. They show up weeks before a renewal conversation turns difficult:<\u002Fp>\n    <ul class=\"signal-list\">\n      <li><strong>Login frequency drops<\u002Fstrong> across a segment of users<\u002Fli>\n      <li><strong>Sentiment shifts<\u002Fstrong> in customer interactions — tone changes before people say anything directly<\u002Fli>\n      <li><strong>Engagement decreases<\u002Fstrong> — fewer replies, cancelled calls, delayed responses<\u002Fli>\n      <li><strong>Support volume drops to zero<\u002Fstrong> — they have stopped trying<\u002Fli>\n      <li><strong>Executive sponsor leaves<\u002Fstrong> — the internal advocate for your tool is gone<\u002Fli>\n    <\u002Ful>\n    <p>None of these signals are invisible. They're simply unconnected. A CSM managing 80 accounts cannot manually cross-reference usage data with support trends and email engagement for every account, every week.<\u002Fp>\n    <div class=\"pull\">The problem isn't that the signals don't exist. It's that no system connects them — and no one has time to do it manually.<\u002Fdiv>\n    <p>This is the gap that Agentic AI addresses. Not by generating dashboards. By doing the connecting — and triggering the right action before the window closes.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">02<\u002Fdiv>\n    <h2>Why traditional automation doesn't solve this.<\u002Fh2>\n    <p>When CS leaders hear \"automation,\" most think of two things: native integrations (CRM → support tool → email) or custom API connections built by their tech team. Both are familiar. And both carry a specific kind of overhead that makes CS leaders hesitant — rightly so.<\u002Fp>\n    <h3>The integration problem<\u002Fh3>\n    <p>Traditional integrations are point-to-point. They connect Tool A to Tool B through a fixed logic: if X happens in one system, trigger Y in another. This works — until it doesn't. APIs change. Tool versions update. A new field gets added and the mapping breaks. What was built as infrastructure becomes a maintenance obligation.<\u002Fp>\n    <p>The result is a dependency on technical resources your CS team doesn't have, and a brittleness that makes people reluctant to build on top of it.<\u002Fp>\n    <h3>Agentic AI in practice — and why tools like n8n matter<\u002Fh3>\n    <p>Tools like n8n changed this equation. They sit above your existing stack and orchestrate logic across systems — without requiring custom API code for every connection. When a tool updates its API, the connector updates centrally. When you need to add a new signal source, you extend the workflow rather than rebuild the integration.<\u002Fp>\n    <p>This shifts automation from an IT project to an operational layer. One that CS strategy can own — and technical partners can implement — without ongoing dependency on your dev team.<\u002Fp>\n    <div class=\"compare\">\n      <div class=\"compare-row\">\n        <div class=\"compare-label\">Traditional integration<\u002Fdiv>\n        <div class=\"compare-text\"><code>Tool A → API → Tool B<\u002Fcode> — breaks when either changes.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"compare-row hero-row\">\n        <div class=\"compare-label\">Workflow orchestration<\u002Fdiv>\n        <ul class=\"compare-points\">\n          <li>A logic layer sits above your stack<\u002Fli>\n          <li>Signals flow in. Actions flow out.<\u002Fli>\n          <li>No custom code. No continuous maintenance.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p>This distinction matters because it removes the biggest objection CS leaders have to automation: \"We'll build it and then spend six months fixing it.\" With modern orchestration, that's not the architecture you're building.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">03<\u002Fdiv>\n    <h2>What Agentic AI actually is — in plain language.<\u002Fh2>\n    <p>\"Agentic AI\" is a term that travels badly. It sounds like a future technology. In practice, it describes something much more concrete: a system that observes context, evaluates it against defined logic, and takes action — without waiting to be asked.<\u002Fp>\n    <p>A traditional automation rule looks like this: if health score drops below 70, send an alert. That's a trigger. It fires, and a human decides what to do next.<\u002Fp>\n    <p>An agentic system goes further. It observes the health score drop. It checks whether there's also been a recent support ticket. It looks at when the last CSM touchpoint was. It checks what stage of the contract cycle the account is in. And then it takes a prepared action — a drafted outreach email, an updated success plan, a task routed to the right CSM — based on the full picture.<\u002Fp>\n    <div class=\"pull\">It's not a rule that fires. It's a system that thinks in context, then acts.<\u002Fdiv>\n    <p>This is not artificial general intelligence. It's not unpredictable or autonomous in a way that should concern you. It's defined logic, applied to connected signals, with a prepared output. The difference from traditional automation is context — and the ability to act on it.<\u002Fp>\n    <p>In a CS environment, this means the difference between a dashboard that shows you a problem and a system that surfaces the right account, tells the CSM why it matters, and hands them something they can send in the next five minutes.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">04<\u002Fdiv>\n    <h2>What this looks like in Customer Success.<\u002Fh2>\n    <p>Three concrete scenarios — each one a signal-to-action loop that exists today, built on tools most SaaS companies already have.<\u002Fp>\n    <div class=\"scenarios\">\n      <div class=\"scenario\">\n        <div class=\"scenario-tag\">Scenario 1 — Churn signal becomes prepared outreach<\u002Fdiv>\n        <p>A mid-tier account shows declining login frequency over three weeks, combined with an open support ticket that hasn't been resolved. The agentic system connects these signals, identifies the account as elevated risk, drafts a CSM outreach email with relevant context pre-filled, and routes it for review. The CSM receives a prepared response to the problem.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scenario\">\n        <div class=\"scenario-tag\">Scenario 2 — Renewal triggers success plan review<\u002Fdiv>\n        <p>An account enters the 90-day pre-renewal window. The system checks the current success plan against agreed objectives, flags gaps, and generates an updated version for the CSM to review before the next call. No manual prep. No discovery conversation to find out what was promised six months ago.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scenario\">\n        <div class=\"scenario-tag\">Scenario 3 — Unmanaged account surfaces expansion signal<\u002Fdiv>\n        <p>A lower-ARR account — one that wouldn't normally receive regular CSM attention — shows a pattern consistent with expansion readiness: increased usage, new user invitations, activity in premium feature areas. The system surfaces it, generates a brief account summary, and suggests a touchpoint. An account that would have been invisible becomes an opportunity.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"loop\">\n      <div class=\"loop-step\"><span class=\"k\">Signal<\u002Fspan><span class=\"v\">Behavioral change detected across data sources<\u002Fspan><\u002Fdiv>\n      <div class=\"loop-step\"><span class=\"k\">Context<\u002Fspan><span class=\"v\">Account history, contract stage, CSM workload considered<\u002Fspan><\u002Fdiv>\n      <div class=\"loop-step\"><span class=\"k\">Action<\u002Fspan><span class=\"v\"><strong>Drafted outreach, updated plan, or routed task<\u002Fstrong> — ready before the CSM opens the account<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>What these scenarios share: the CSM isn't replaced. They're prepared. The work that currently lives between \"I need to check on this\" and \"I'm ready to act\" is handled by the system.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">05<\u002Fdiv>\n    <h2>CS platform or agentic automation? The honest answer.<\u002Fh2>\n    <p>Most CS teams asking this question already have a CRM. Sales set it up — HubSpot, Pipedrive, or similar — and it's running. The real question isn't which technology is better. It's: do you build on what's already there, or do you add a second system?<\u002Fp>\n    <p>A CS platform brings its own data model, its own health score logic, its own way of structuring workflows. For teams starting from scratch, that structure can be valuable. For teams with a functioning CRM stack, it means a second system to integrate, maintain, and pay for — sitting next to the first one, never fully replacing it.<\u002Fp>\n    <p>Agentic automation sits on top of your existing stack and connects logic across it. No second data model. No migration. No platform logic you have to adapt your process to fit. You start with one use case, get it working, and build from there — each step on your terms, not a vendor's implementation framework.<\u002Fp>\n    <div class=\"pull\">Start with one use case. Get it working. Build from there.<\u002Fdiv>\n    <p>If you don't have a functioning CRM, or need a fully structured CS infrastructure from day one, a platform may be the better starting point. But if your stack is already in place and you want to start solving specific problems without a large upfront commitment — agentic automation is worth considering first.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"chapter\">\n    <div class=\"chapter-num\">06<\u002Fdiv>\n    <h2>Where to start.<\u002Fh2>\n    <p>The question CS leaders most often ask after understanding what's possible is: \"Where does this fit in our current setup?\" It's a better question than \"What tool do we buy?\"<\u002Fp>\n    <p>The answer depends on one thing: where in your CS motion does timing matter most? Where is late action — or no action — costing you ARR right now?<\u002Fp>\n    <p>For most CS teams, that's one of three places:<\u002Fp>\n    <ul class=\"signal-list\">\n      <li><strong>Onboarding<\u002Fstrong> — customers who don't reach value in time and quietly disengage<\u002Fli>\n      <li><strong>Mid-lifecycle churn signals<\u002Fstrong> — accounts that show behavioral change weeks before a CSM notices<\u002Fli>\n      <li><strong>Unmanaged accounts<\u002Fstrong> — the segment of your portfolio that receives reactive-only attention<\u002Fli>\n    <\u002Ful>\n    <p>A signal-to-action system doesn't require a full CS transformation to deliver value. It can start in one of these areas, with the signals you already have, inside the tools you already use.<\u002Fp>\n    <p>The infrastructure investment is lower than most CS leaders expect. The operational impact — in CSM capacity, in retention risk coverage, in account visibility — is higher.<\u002Fp>\n    <div class=\"pull\">The signals are already there. The question is whether your system is built to act on them.<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Farticle>\n\n<!-- AUTHORS -->\n<section class=\"authors\">\n  <div class=\"authors-inner\">\n    <div class=\"section-label\" style=\"font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--teal-ink); font-weight:600; margin-bottom:1rem;\">About the authors<\u002Fdiv>\n    <p class=\"authors-lead\">Together, Kaiser CX and Pollup AI combine CS strategy with technical build — from signal definition to working automation.<\u002Fp>\n    <div class=\"authors-grid\">\n      <div class=\"author\">\n        <div class=\"author-tag\">Kaiser CX · CS Strategy<\u002Fdiv>\n        <h3>Christiane Kaiser<\u002Fh3>\n        <p>Founder of Kaiser CX Consulting, a B2B Customer Success consultancy. 15 years of CS experience, including nearly a decade leading international CS teams at Brandwatch. She works with European Series B SaaS companies on scalable CS infrastructure, AI-readiness, and signal-to-action systems.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"author\">\n        <div class=\"author-tag\">Pollup AI · Technical Implementation<\u002Fdiv>\n        <h3>Caroline Dépierre<\u002Fh3>\n        <p>CEO and co-founder at Pollup AI, implementing automations and agentic AI for client-facing teams. Pollup AI is currently building the AI-powered signal-to-action engine that automatically turns B2B SaaS customer data into retention and expansion revenue.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section class=\"cta-band\">\n  <h2>The signals are already there. <span>Let's act on them.<\u002Fspan><\u002Fh2>\n  <p>30 minutes. No sales pitch. We'll look at your setup and tell you honestly where a signal-to-action system fits.<\u002Fp>\n  <div class=\"cta-actions\">\n    <a href=\"https://calendly.com/christiane-kaiser-cx/30min\" target=\"_blank\" class=\"cta-btn\">Book a 30-min call →<\u002Fa>\n    <a href=\"whitepaper-signal-to-action.pdf\" download=\"\" class=\"cta-btn ghost\">↓ Download the PDF<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <span>© 2025 Kaiser CX Consulting<\u002Fspan>\n  <span>\n    <a href=\"impressum.html\">Legal Notice<\u002Fa> ·\n    <a href=\"datenschutz.html\">Privacy Policy<\u002Fa>\n  <\u002Fspan>\n  <span>kaiser-cx.com<\u002Fspan>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
